[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gracedays"
version = "0.1.0"
description = "Evidence-backed post-purchase deadline assistant with MCP and Cloudflare D1"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "pydantic>=2.10,<3",
  "streamlit>=1.40,<2",
  "pandas>=2.2,<3",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gracedays*"]
