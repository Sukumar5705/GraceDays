[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gracedays"
version = "0.1.0"
description = "Evidence-backed assistant for purchase deadlines and next steps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "GraceDays contributors" }]
dependencies = [
  "mcp>=2,<3",
  "streamlit",
  "pydantic>=2,<3",
  "python-dotenv",
  "python-dateutil",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
